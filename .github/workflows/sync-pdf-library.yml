name: Sync PDF Library Manifest

on:
  push:
    branches:
      - main
    paths:
      - '**/*.pdf'
      - '**/*.PDF'
  workflow_dispatch:

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate PDF Manifest
        run: |
          python -c "
          import os, json
          pdfs = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              for file in files:
                  if file.lower().endswith('.pdf'):
                      rel_path = os.path.relpath(os.path.join(root, file), '.').replace('\\\\', '/')
                      clean_name = os.path.splitext(file)[0].replace('_', ' ').replace('-', ' ')
                      pdfs.append({'title': clean_name, 'filename': file, 'path': rel_path})
          pdfs.sort(key=lambda x: x['title'].lower())
          with open('pdf-manifest.json', 'w') as f:
              json.dump(pdfs, f, indent=2)
          "

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf-manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of pdf-manifest.json" && git push)
